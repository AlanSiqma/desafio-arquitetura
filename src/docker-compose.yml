services:

  postgres:
    image: postgres:17
    container_name: controle_lancamentos_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 10


  rabbitmq:
    image: rabbitmq:4-management
    container_name: controle_lancamentos_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10


  mongodb:
    image: mongo:8
    container_name: controle_lancamentos_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\""]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: desafio_keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
      - keycloak_data:/opt/keycloak/data


  controle-lancamentos:
    build:
      context: .
      dockerfile: MicroService.ControleLancamentos/Dockerfile

    container_name: controle_lancamentos_api
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    environment:
      ASPNETCORE_URLS: http://+:8080
      OpenTelemetry__Endpoint: "http://otel-collector:4317"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=app;Username=postgres;Password=postgres"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__VirtualHost: /
      RabbitMQ__Username: admin
      RabbitMQ__Password: admin

    ports:
      - "5001:8080"

  consolidado-diario:
    build:
      context: .
      dockerfile: MicroService.ConsolidadoDiario/Dockerfile

    container_name: consolidado_diario_api
    restart: unless-stopped

    depends_on:
      mongodb:
        condition: service_healthy

    environment:
      ASPNETCORE_URLS: http://+:8080
      OpenTelemetry__Endpoint: "http://otel-collector:4317"
      MongoDB__ConnectionString: "mongodb://admin:admin@mongodb:27017/?authSource=admin"
      MongoDB__Database: "consolidado_diario"

    ports:
      - "5002:8080"

  consumer-consolidado:
    build:
      context: .
      dockerfile: Consumer.ConsolidadoDiario/Dockerfile

    container_name: consumer_consolidado_diario
    restart: unless-stopped

    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    environment:
      MongoDB__ConnectionString: "mongodb://admin:admin@mongodb:27017/?authSource=admin"
      MongoDB__Database: "consolidado_diario"
      OpenTelemetry__Endpoint: "http://otel-collector:4317"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__VirtualHost: /
      RabbitMQ__Username: admin
      RabbitMQ__Password: admin


volumes:
  postgres_data:
  rabbitmq_data:
  mongodb_data:
  prometheus_data:
  grafana_data:
  keycloak_data: